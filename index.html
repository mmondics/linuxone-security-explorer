<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinuxONE security architecture explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--blue:#0f62fe;--blue-d:#0043ce;--blue-l:#edf5ff;--red:#da1e28;--red-l:#fff1f1;--green:#198038;--green-l:#defbe6;--yellow:#f1c21b;--yellow-l:#fcf4d6;--purple:#8a3ffc;--purple-l:#f6f2ff;--teal:#007d79;--teal-l:#d9fbfb;--g10:#f4f4f4;--g20:#e0e0e0;--g30:#c6c6c6;--g50:#8d8d8d;--g60:#6f6f6f;--g70:#525252;--g80:#393939;--g100:#161616}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--g100);font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
code,.mono{font-family:"IBM Plex Mono",Menlo,monospace}
header{background:var(--g100);color:#fff;min-height:48px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:0 16px}
header b{font-size:14px;font-weight:600}header b span{font-weight:400}
header .sub{font-size:14px;color:var(--g30)}
main{max-width:1480px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:36px;line-height:44px;font-weight:300;letter-spacing:-.02em}
.lede{margin:0;font-size:16px;line-height:24px;color:var(--g70);max-width:1040px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--g20)}
.tab{background:none;border:0;border-bottom:2px solid transparent;min-height:44px;padding:8px 16px;cursor:pointer;font-size:14px;color:var(--g70)}
.tab[aria-selected="true"]{border-bottom-color:var(--blue);color:var(--g100);font-weight:600}
.tab:hover{background:var(--g10)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{font-size:14px;color:var(--g70);margin-right:4px}
.chip{min-height:40px;padding:8px 14px;cursor:pointer;font-size:14px;background:#fff;border:1px solid var(--g30)}
.chip:hover{border-color:var(--g70)}
.chip[aria-pressed="true"]{background:var(--g100);color:#fff;border-color:var(--g100)}
.wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.stage{flex:3 1 620px;min-width:0;border:1px solid var(--g20);padding:20px;background:#fff}
.panel{flex:2 1 380px;min-width:0;border:1px solid var(--g20);background:var(--g10);padding:20px;display:flex;flex-direction:column;gap:8px;position:sticky;top:12px}
.panel .k{font-size:12px;color:var(--g70)}
.panel .t{font-size:20px;line-height:28px;font-weight:500}
.facts{display:flex;flex-direction:column;margin-top:4px}
.fact{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--g30);font-size:14px;line-height:20px}
.fact span:first-child{color:var(--g70)}.fact span:last-child{font-weight:600;text-align:right}
.panel p{margin:0;font-size:14px;line-height:20px;color:var(--g80)}
.dg{margin:6px 0 2px;padding:12px;background:#fff;border:1px solid var(--g20)}.dg svg{display:block;width:100%;height:auto}.dg figcaption{font-size:12px;color:var(--g70);margin-top:8px;line-height:16px}
.x86{margin-top:4px;padding:10px 12px;background:#fff;border-left:3px solid var(--g50);font-size:14px;line-height:20px;color:var(--g80)}
.x86 b{display:block;font-size:12px;color:var(--g70);font-weight:600;margin-bottom:2px}
.caveat{padding:10px 12px;background:var(--yellow-l);border:1px solid #b28600;font-size:14px;line-height:20px}
.link{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--blue);cursor:pointer;font-size:14px;text-decoration:underline}
/* stack */
.stack{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:200px 1fr;gap:0;border:1px solid var(--g30);background:#fff;transition:opacity .2s}
.layer.dim{opacity:.35}
.layer.cmp{grid-template-columns:200px 1fr 1fr}
.lh{background:var(--lc,var(--g10));border:0;border-right:1px solid var(--g30);text-align:left;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lh .n{font-size:12px;color:var(--g70)}.lh .tt{font-size:15px;font-weight:600;line-height:1.3}
.lh[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:-2px}
.comps{display:flex;flex-wrap:wrap;gap:6px;padding:10px;align-content:center}
.comp{border:1px solid var(--g30);background:#fff;padding:6px 10px;font-size:13px;cursor:pointer;min-height:36px;text-align:left}
.comp:hover{border-color:var(--blue)}
.comp[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.comp.hit{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-l)}
.comp.hit[aria-pressed="true"]{background:var(--blue);color:#fff}
.xcol{border-left:1px dashed var(--g30);padding:10px 12px;font-size:13px;line-height:18px;color:var(--g80);background:#fafafa}
.xcol b{display:block;font-size:11px;color:var(--g60);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.cmphead{display:grid;grid-template-columns:200px 1fr 1fr;font-size:12px;color:var(--g70);font-weight:600;padding:0 0 4px}
.cmphead span:nth-child(2){padding-left:10px}.cmphead span:nth-child(3){padding-left:12px}
.sysbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sysbar span{font-size:12px;padding:4px 8px;background:var(--g100);color:#fff}
/* vulns */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.sumcard{border:1px solid var(--g30);padding:12px 14px}
.sumcard h3{margin:0 0 2px;font-size:16px;font-weight:600}
.sumcard .meta{font-size:12px;color:var(--g70);margin-bottom:10px}
.bar{display:flex;height:14px;width:100%;background:var(--g20)}
.bar i{display:block;height:100%}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.vt{width:100%;border-collapse:collapse;font-size:13px}
.vt th{text-align:left;font-weight:600;font-size:12px;color:var(--g70);padding:6px 8px;border-bottom:1px solid var(--g30)}
.vt td{padding:0;border-bottom:1px solid var(--g20);vertical-align:top}
.vt td button{all:unset;display:block;width:100%;padding:7px 8px;cursor:pointer;box-sizing:border-box}
.vt td button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.vt tr.sel td{background:var(--blue-l)}
.vt tr:hover td{background:var(--g10)}
.st{display:inline-block;padding:2px 6px;font-size:12px;font-weight:600;white-space:nowrap}
.st.v{background:var(--red);color:#fff}.st.u{background:var(--yellow);color:var(--g100)}.st.m{background:var(--yellow-l);color:#8e6a00;border:1px solid #b28600}.st.n{background:var(--green-l);color:var(--green);border:1px solid var(--green)}
.raw{font-size:11.5px;color:var(--g70);margin-top:2px;font-family:"IBM Plex Mono",monospace;word-break:break-word}
.term{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.term pre{margin:0;background:var(--g100);color:#f4f4f4;padding:12px;font-size:11.5px;line-height:1.55;overflow:auto;font-family:"IBM Plex Mono",monospace;max-height:560px}
.term pre .p{color:#78a9ff}.term pre .bad{color:#ff8389}.term pre .mit{color:#f1c21b}.term pre .ok{color:#42be65}
/* generic diagram bits */
.flow{display:flex;flex-direction:column;gap:0}
.fstep{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:stretch}
.fstep .rail{display:flex;flex-direction:column;align-items:center}
.fstep .rail .b{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;background:var(--g50);flex:0 0 auto}
.fstep .rail .ln{flex:1;width:2px;background:var(--g30);min-height:12px}
.fbox{border:1px solid var(--g30);padding:10px 12px;margin-bottom:10px;background:#fff;text-align:left;cursor:pointer;width:100%}
.fbox .h{font-size:14px;font-weight:600}.fbox .d{font-size:13px;color:var(--g70);margin-top:2px;line-height:18px}
.fbox[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:-2px}
.ok .b{background:var(--green)}.bad .b{background:var(--red)}.na .b{background:var(--g50)}
.ok .fbox{border-color:var(--green);background:var(--green-l)}
.bad .fbox{border-color:var(--red);background:var(--red-l)}
.blocked .fbox{border-style:dashed;background:#fff;opacity:.55}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;margin-left:6px;vertical-align:1px}
.pill.g{background:var(--green);color:#fff}.pill.r{background:var(--red);color:#fff}.pill.y{background:var(--yellow);color:var(--g100)}.pill.gr{background:var(--g20);color:var(--g80)}
.checks{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--g30);font-size:14px;line-height:20px}
.check .ic{flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.check.y .ic{background:var(--red)}.check.no .ic{background:var(--green)}.check.q .ic{background:var(--yellow);color:var(--g100)}
/* isolation */
.iso{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.isobox{border:1px solid var(--g30);padding:12px}
.isobox h3{margin:0 0 8px;font-size:15px;font-weight:600}
.cec{border:2px dashed var(--g50);padding:10px;display:flex;flex-direction:column;gap:6px}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.part{border-left:5px solid var(--red);padding:6px;display:flex;flex-direction:column;gap:4px;min-height:150px}
.part:last-child{border-right:5px solid var(--red)}
.part .os{background:#bfd7ff;border:1px solid var(--blue);font-size:11px;padding:4px;text-align:center}
.part .vm{background:#a7f0ba;border:1px solid var(--green);font-size:11px;padding:4px;text-align:center}
.part .pp{border:1px solid var(--g80);font-size:11px;padding:4px;text-align:center;background:#fff}
.part.hot .os{background:var(--red);color:#fff;border-color:var(--red)}
.part.hit{background:var(--red-l)}
.fwbar{background:#e8daff;border:1px solid var(--purple);text-align:center;font-size:12px;padding:4px}
.hwbar{background:#a6c8ff;border:1px solid var(--blue);text-align:center;font-size:12px;padding:4px;font-weight:600}
.racks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.srv{border:2px solid var(--g80);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:150px;border-radius:6px 6px 0 0}
.srv .os{font-size:11px;padding:4px;text-align:center;background:#bfd7ff;border:1px solid var(--blue)}
.srv.hot .os,.srv.hit .os{background:var(--red);color:#fff;border-color:var(--red)}
.srv .vm{font-size:11px;padding:4px;text-align:center;background:var(--g10);border:1px solid var(--g50)}
.net{margin-top:8px;padding:6px;text-align:center;font-size:12px;border:1px solid var(--teal);background:var(--teal-l)}
.net.hit{background:var(--red);color:#fff;border-color:var(--red)}
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;background:var(--g10);border:1px solid var(--g20);margin-bottom:14px}
.btn{min-height:40px;padding:8px 14px;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;border:1px solid var(--blue)}
.btn.sec{background:#fff;color:var(--blue)}
.btn[aria-disabled="true"]{background:var(--g20);border-color:var(--g20);color:var(--g50);cursor:not-allowed}
/* confidential computing */
.ccd{border:1px solid var(--g80);padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.ccd .lp{font-size:12px;color:var(--g70)}
.kvmhost{background:#d0d0d0;border:1px solid var(--g70);padding:10px}
.kvmhost .lp{margin-bottom:6px}
.guests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.guest{border:1px solid var(--g80);background:#fff;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-start}
.guest[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:-2px}
.guest .gn{font-size:12px;font-weight:600;margin-bottom:6px;min-height:32px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.mem i{display:block;height:20px;font-style:normal;font-size:9px;font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;justify-content:center;border:1px solid var(--g50);background:#fff;color:var(--g80);overflow:hidden}
.mem i.enc{background:repeating-linear-gradient(45deg,#525252 0 3px,#a8a8a8 3px 6px);color:#fff;border-color:var(--g80)}
.mem i.clr{background:var(--green-l);border-color:var(--green);color:var(--green)}
.fwrow{display:grid;grid-template-columns:1fr 2fr;gap:8px;align-items:stretch}
.box{border:1px solid var(--g70);background:#e8e8e8;padding:8px;font-size:12px;text-align:center;cursor:pointer}
.box[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:-2px}
.box.u{background:#e8daff;border-color:var(--purple)}
.hpstack{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.hpstack span{font-size:10.5px;padding:3px;text-align:center;background:#0043ce;color:#fff}
.hpstack span.c{background:#002d9c}
.viewbadge{font-size:13px;padding:8px 12px;border:1px solid var(--g30);background:var(--g10)}
/* keys */
.keyflow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{border:1px solid var(--g30);padding:12px;cursor:pointer;text-align:left;background:#fff;display:flex;flex-direction:column;gap:6px}
.key[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:-2px}
.key .kt{font-size:15px;font-weight:600}.key .kd{font-size:13px;color:var(--g70);line-height:18px}
.key .where{font-size:12px;font-weight:600;padding:3px 6px;align-self:flex-start}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.qcard{border:1px solid var(--g30);padding:12px;text-align:left;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:4px}
.qcard[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:-2px}
.qcard .qk{font-size:12px;color:var(--g70)}.qcard .qt{font-size:15px;font-weight:600}.qcard .qd{font-size:13px;color:var(--g70);line-height:18px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px}
.stat div{border-top:3px solid var(--blue);padding:8px 0}
.stat b{display:block;font-size:28px;font-weight:300;line-height:36px}
.stat span{font-size:12px;color:var(--g70)}
.vs{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
.vs th,.vs td{padding:8px;border-bottom:1px solid var(--g20);text-align:left;vertical-align:top;line-height:18px}
.vs th{font-size:12px;color:var(--g70)}
.vs td:first-child{font-weight:600;width:22%}
.mcluster{border:1px solid var(--g30);padding:12px;display:flex;flex-direction:column;gap:10px;background:#fafafa}
.mcp{background:var(--g100);color:#fff;font-size:13px;font-weight:600;padding:8px 12px}.mcp span{font-weight:400;color:var(--g30)}
.mcp.small{display:none}
.mpools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mpools.paired{grid-template-columns:1fr 1fr;grid-template-areas:"ca cb" "px pz"}
.mpools.paired .mcp.small{display:block;font-size:12px}
.mpools.paired>:nth-child(1){grid-area:ca}.mpools.paired>:nth-child(2){grid-area:px}.mpools.paired>:nth-child(3){grid-area:cb}.mpools.paired>:nth-child(4){grid-area:pz}
.mpool{border:2px solid var(--g50);background:#fff;padding:10px;min-height:170px;transition:border-color .3s,background .3s}
.mpool.bad{border-color:var(--red);background:var(--red-l)}
.mph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.mph b{display:block;font-size:14px}.mph span{font-size:12px;color:var(--g70)}
.mpods{display:flex;flex-wrap:wrap;gap:6px}
.mpod{border:1px solid var(--blue);background:var(--blue-l);font-size:12.5px;padding:6px 8px;display:inline-flex;gap:6px;align-items:center}
.mpod em{font-style:normal;font-size:10.5px;font-weight:600;background:var(--blue);color:#fff;padding:1px 5px}
.mpod.arrive{animation:arrive .5s ease-out}
@keyframes arrive{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.mpod.arrive{animation:none}}
.mempty{font-size:12px;color:var(--g60)}
.mgit{font-size:12px;color:var(--g80);border:1px dashed var(--g50);padding:6px 10px;text-align:center;background:#fff}
.mplay{margin:0;padding-left:22px;font-size:14px;line-height:22px;color:var(--g70)}
.mplay li.done{color:var(--g100);font-weight:500}.mplay li.done::marker{color:var(--green);font-weight:700}
.mplay li.skip{color:var(--g50);text-decoration:line-through}
@media (max-width:760px){.mpools,.mpools.paired{grid-template-columns:1fr;grid-template-areas:none}.mpools.paired>*{grid-area:auto!important}}
.mgrps{display:flex;flex-direction:column;gap:8px}
.mgrp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mgl{font-size:13px;color:var(--g80);font-weight:600;min-width:270px}
.mprof{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--g30)}
.mprof div{padding:10px 12px;border-left:1px solid var(--g20)}.mprof div:first-child{border-left:0}
.mprof span{display:block;font-size:11.5px;color:var(--g70);margin-bottom:2px}.mprof b{font-size:13.5px;font-weight:600;line-height:18px}
.mwls{display:flex;flex-direction:column;gap:6px}
.mwl{border:1px solid var(--g30);background:#fff;padding:6px 10px;display:grid;grid-template-columns:1fr auto;column-gap:8px}
.mwl b{font-size:13px}.mwl span{grid-column:1;font-size:11.5px;color:var(--g70)}
.mwl em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:11px;font-weight:600;background:var(--red);color:#fff;padding:2px 6px}
.mwl em.co{background:var(--yellow);color:var(--g100)}
.mwl.exp{border:2px solid var(--red)}
.mwl.risk{border-style:dashed}
.mwl.arrive{animation:arrive .5s ease-out}
@media (max-width:760px){.mprof{grid-template-columns:1fr 1fr}.mgl{min-width:0;width:100%}}
.xtl{display:flex;flex-direction:column;gap:0}
.xyr{display:grid;grid-template-columns:64px 1fr;gap:12px;border-left:2px solid var(--g30);margin-left:28px;padding:0 0 14px 0;position:relative}
.xyr::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:6px;background:var(--g100)}
.xy{font-size:15px;font-weight:600;padding-left:14px;padding-top:2px}
.xitems{display:flex;flex-direction:column;gap:8px}
.xcard{border:1px solid var(--g30);border-left:4px solid var(--red);background:#fff;padding:8px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.xcard:hover{border-color:var(--g70);border-left-color:var(--red)}
.xcard[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:-1px}
.xh{display:flex;justify-content:space-between;gap:8px;align-items:center}.xh b{font-size:14px}
.xc{font-size:12.5px;color:var(--g70)}
.xok{font-size:11.5px;font-weight:600;color:var(--green)}
.xtag{font-size:11px;font-weight:600;padding:2px 6px;white-space:nowrap}.xtag.cpu{background:#e8daff;color:#491d8b}.xtag.sw{background:var(--teal-l);color:#005d5d}
.xresp{margin-top:18px;border-top:1px solid var(--g20);padding-top:16px}
.xresp h3{margin:0 0 10px;font-size:15px}
.xresp p{margin:12px 0 4px;font-size:14px;line-height:20px;color:var(--g80)}
.xsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xsteps div{display:flex;gap:8px;align-items:flex-start;background:var(--g10);padding:10px;font-size:13.5px;line-height:18px}
.xsteps b{flex:0 0 22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}

</main>

<script>

 {id:'L8',t:'Applications and data platforms',c:'#f6f2ff',comps:['mongodb','confluent','edb','otherdb','java','ep11app']},
 {id:'L7',t:'OpenShift and containers',c:'#f6f2ff',comps:['ocpiso','agents','hpcr']},

];

const LENSMAP={
 iso:['eal5','hipersockets','prsm','ultra','se','ocpiso','agents','isa','kvm','zvm'],
 rest:['dmcrypt','cex','telum','hpvs','cryptolibs','mongodb','confluent','edb','otherdb'],
 flight:['telum','cryptolibs','hipersockets','java','ep11app','mongodb','confluent','edb','otherdb'],
 use:['se','ultra','hpvs','attest','hpcr'],
 qs:['qsboot','cex','cryptolibs','telum'],
 integ:['qsboot','attest','hpvs','se','hpcr','prsm']
};

const D={
/* ---- layers ---- */
L1:{k:'Platform area',t:'Hardware',facts:[['Processor','IBM Telum II'],['Instruction set','s390x (z/Architecture)'],['On-chip crypto','CPACF on every core'],['HSM','Crypto Express8S']],notes:['Security starts in silicon. Every core carries CPACF, the on-chip crypto accelerator, and the Crypto Express8S HSM adds tamper-responding key storage. The s390x instruction set and microarchitecture are entirely separate from x86, which is why many x86 CPU flaws don’t apply here.'],x86:'Encryption acceleration (AES-NI, QAT) varies by generation and SKU. HSMs are third-party add-on cards or network appliances.'},
L2:{k:'Platform area',t:'Firmware',facts:[['Partitioning','PR/SM (Type-1, in firmware)'],['Confidential computing','Ultravisor'],['Boot','Quantum-safe secure boot']],notes:['PR/SM creates and isolates partitions below any operating system. The Ultravisor is trusted firmware that enforces Secure Execution. Initial Machine Load (IML) firmware is verified with both classical and quantum-safe signatures.'],x86:'The hypervisor is software running on the same cores, caches and memory controllers as the workloads.'},
L3:{k:'Platform area',t:'Logical partitions',facts:[['Isolation rating','Common Criteria EAL5+'],['Partition networking','HiperSockets and SMC-D (in memory)']],notes:['Partitions are isolated by firmware and hardware, rated to Common Criteria EAL5+. IBM positions this as isolation comparable to separate physical servers, without a physical network between them.'],x86:'VM isolation typically rated EAL4+ (for example VMware), with “noisy neighbor” and bleed-through risk from shared caches and buffers.'},
L4:{k:'Platform area',t:'Hypervisor',facts:[['Options','KVM, z/VM, OpenShift Virtualization'],['Runs inside','A partition']],notes:['A hypervisor runs inside a partition, so a hypervisor compromise is still bounded by the EAL5+ partition boundary underneath it.'],x86:'The hypervisor is usually the outermost boundary; escaping it reaches the whole host.'},
L5:{k:'Platform area',t:'Confidential computing',facts:[['Technology','IBM Secure Execution for Linux'],['Protects','Data in use'],['Productized as','Hyper Protect Virtual Servers']],notes:['Secure Execution runs KVM guests in a hardware-based trusted execution environment (TEE). The hypervisor and host administrators can’t read or change guest memory or state.'],x86:'Intel TDX and AMD SEV-SNP offer comparable TEEs on recent generations; availability depends on CPU, firmware and cloud support.'},
L6:{k:'Platform area',t:'Linux',facts:[['Distributions','RHEL, SUSE, Ubuntu'],['Kernel','Same Linux, s390x build'],['Encryption','dm-crypt with protected keys']],notes:['The same Linux distributions and tools used everywhere else, so teams put the skills they already have to work. The kernel reports far fewer CPU vulnerabilities, and full-disk encryption uses CPACF with protected keys that never appear in the clear in memory.'],x86:'Same distributions; the kernel carries more CPU-flaw mitigations, several with performance cost.'},
L7:{k:'Platform area',t:'OpenShift and containers',facts:[['Platform','Red Hat OpenShift on s390x'],['Cluster placement','One cluster per set of partitions']],notes:['OpenShift runs the same way as on other platforms. Placing clusters, tenants or risky workloads in their own partitions puts an EAL5+ boundary between them instead of only namespaces and network policy.'],x86:'Cluster separation usually means separate VMs or servers joined by a physical network.'},
L8:{k:'Platform area',t:'Applications and data platforms',facts:[['Data platforms','MongoDB, Confluent Platform, EDB Postgres, Db2, Oracle Database'],['Runtimes','OpenJDK, IBM Semeru, Python, Node.js, Go'],['App crypto','Transparent CPACF via standard libraries']],notes:['Vendor databases and applications run unchanged and inherit the platform’s protections: encrypted volumes, accelerated TLS, partition isolation and confidential computing.','Applications are unchanged. They gain hardware crypto through OpenSSL, Java and PKCS#11 without code changes. Architecture-specific runtime bugs, such as the November 2026 java4shell CVE on x86, don’t carry over.'],x86:'Same runtimes; architecture-specific code paths (such as AVX-512 intrinsics) bring their own bugs.',go:['java','See the Java CVE']},
/* ---- components ---- */
isa:{k:'Hardware',t:'s390x instruction set',facts:[['Architecture','z/Architecture (s390x)'],['x86-only CPU flaws','Don’t apply'],['Examples','Foreshadow, MDS, Downfall, Zenbleed, Reptar']],notes:['s390x is the name Linux uses for the processor architecture of IBM LinuxONE and IBM Z, alongside x86_64 for Intel and AMD and aarch64 for ARM. The same Linux distributions are built for it; the processor design is entirely different.','Meltdown, MDS, L1TF, TSX Async Abort, Downfall and similar flaws exploit specific x86 microarchitecture features. s390x doesn’t have those features, so the Linux kernel reports “Not affected”.','Spectre v1 and v2 affect any speculating processor, including s390x. They’re mitigated here with pointer sanitization and the hardware etokens facility.'],x86:'Every new x86 CPU flaw needs microcode, firmware or kernel mitigations, often with a performance cost.',go:['vulns','See x86-specific vulnerabilities']},
telum:{k:'Hardware',t:'Telum II processor and CPACF',facts:[['CPACF','On every core, not optional'],['Enable','Feature code, no extra hardware'],['Encryption speed','3× to 9× faster than x86 (IBM)'],['Encrypted block I/O','Up to 15M read / 7.5M read-write IOPS (IBM)']],notes:['CP Assist for Cryptographic Functions (CPACF) is built into every core and handles AES, SHA and other symmetric crypto at line rate. CPACF works with “protected keys”, so key material isn’t exposed in operating system memory.','IBM’s internal test: up to 15 million read-only and 7.5 million read-write I/O operations per second to an encrypted block device with FCP storage (IBM z17, RHEL 9.4, FlashSystem 9500; results may vary).'],x86:'AES-NI is widely available; QuickAssist (QAT) isn’t on every generation or SKU. Neither supports a protected-key model.',go:['qs','See pervasive encryption']},
cex:{k:'Hardware',t:'Crypto Express8S HSM',facts:[['Certification','FIPS 140-2 Level 4'],['Tamper','Tamper-responding'],['Modes','CCA, EP11 (Enterprise PKCS#11)'],['Post-quantum','ML-DSA (Dilithium), ML-KEM (Kyber)']],notes:['The HSM card holds master keys that never leave it. It’s tightly integrated with CPACF to create protected keys, which is what lets disk and network encryption run fast without exposing clear keys.','Combined with LinuxONE 5, it supports CRYSTALS-Dilithium and CRYSTALS-Kyber for post-quantum cryptography (requires the Linux on IBM Z CCA 8.1 Support Program).'],x86:'Third-party HSMs (for example a Thales Luna PCIe card) typically certify to FIPS 140-2 Level 3 and don’t integrate with on-chip crypto for data at rest and in flight.'},
prsm:{k:'Firmware',t:'PR/SM',facts:[['Type','Type-1 partitioning in firmware'],['Runs below','Every operating system and hypervisor'],['Rating','Common Criteria EAL5+']],notes:['PR/SM (Processor Resource/Systems Manager) divides the machine into partitions. It isn’t software running on the workload cores, so a guest can’t attack it the way it could attack a software hypervisor.'],x86:'Partitioning is done by a software hypervisor sharing cores, caches and memory controllers with the guests.'},
ultra:{k:'Firmware',t:'Ultravisor',facts:[['Role','Trusted firmware for Secure Execution'],['Protects','Guest memory and CPU state'],['Isolated from','KVM hypervisor and other guests']],notes:['The Ultravisor keeps a table of secure guests and enforces memory and state protection. When the hypervisor tries to read a secure guest’s pages, it only sees encrypted content.'],x86:'Intel TDX uses a TDX module; AMD SEV-SNP uses the AMD Secure Processor. Both exist only on recent generations.',go:['cc','See how it works']},
qsboot:{k:'Firmware',t:'Quantum-safe secure boot',facts:[['Signatures','Classical and quantum-safe (dual)'],['Verifies','Initial Machine Load (IML) firmware'],['Changes needed','None']],notes:['IBM z17 and LinuxONE 5 secure boot uses a built-in dual signature scheme to perform hardware-protected verification of the firmware, which protects it against future quantum attacks on classical signatures.'],x86:'UEFI secure boot uses classical signatures only today.'},
eal5:{k:'Partitions',t:'EAL5+ partition isolation',facts:[['Rating','Common Criteria EAL5+'],['Enforced by','Firmware and hardware'],['Physical network between partitions','Not needed']],notes:['Partitions are rated at the highest isolation level available for a commercial server. IBM’s position is that partitions are more secure than air-gapped servers, because air-gapped servers still share a physical network that can be attacked, and partitions don’t need one.'],x86:'VM isolation typically EAL4+. In 2025, Cisco issued patches for at least 6 major or critical security advisories affecting its Unified Communications portfolio.',go:['iso','See the rogue-agent scenario']},
hipersockets:{k:'Partitions',t:'HiperSockets and SMC-D',facts:[['HiperSockets','In-memory TCP/IP network between partitions'],['SMC-D','Shared Memory Communications over Internal Shared Memory (ISM)'],['Application changes','None'],['Leaves the machine','No']],notes:['HiperSockets gives partitions an in-memory network with no adapter, switch or cable. Traffic never leaves the machine, which removes the physical network as an attack path.','SMC-D (Shared Memory Communications – Direct Memory Access) goes further for TCP socket applications on the same machine: after a normal TCP handshake, data moves directly between the partitions’ memory through Internal Shared Memory, bypassing the TCP/IP stack. It’s transparent to applications, cuts latency and CPU use, and the traffic stays inside the machine.'],x86:'Server-to-server traffic crosses switches and cables, which are part of the attack surface.'},
kvm:{k:'Hypervisor',t:'KVM',facts:[['Distributions','RHEL, SUSE, Ubuntu'],['Confidential guests','Yes, Secure Execution']],notes:['Standard KVM, s390x build. It’s the hypervisor that runs Secure Execution guests, while being unable to read them.'],x86:'Same KVM; confidential guests depend on TDX or SEV-SNP hardware.'},
zvm:{k:'Hypervisor',t:'z/VM',facts:[['Type','IBM hypervisor for Z and LinuxONE'],['Track record','Decades in production'],['Integrity','Backed by the IBM Z System Integrity Statement'],['Strength','Very high guest density']],notes:['z/VM runs large numbers of Linux guests inside a partition, with mature resource controls and decades of hardening in the most security-conscious industries.','It’s covered by the IBM Z System Integrity Statement, IBM’s long-standing commitment to fix any integrity exposure in the operating system. Security and integrity fixes are delivered to customers through the IBM Z and LinuxONE Security Portal.'],x86:'Comparable role to VMware ESXi.'},
ocpv:{k:'Hypervisor',t:'OpenShift Virtualization',facts:[['Base','KubeVirt on KVM'],['Runs on','Bare-metal OpenShift in a partition']],notes:['VMs and containers managed together on OpenShift. The partition boundary still sits underneath the whole cluster.'],x86:'Same software; outer boundary is the physical server.'},
se:{k:'Confidential computing',t:'IBM Secure Execution for Linux',facts:[['Protects','Data in use'],['Trusted base','Ultravisor firmware'],['Host admin access to guest memory','None'],['Image','Encrypted for specific host keys']],notes:['Guests run in a hardware TEE. The guest image is encrypted with the public host key of the machines allowed to run it, so it won’t boot anywhere else. Image attestation and secure boot prove the image wasn’t tampered with.'],x86:'Intel TDX and AMD SEV-SNP are the closest equivalents.',go:['cc','Explore Secure Execution']},
hpvs:{k:'Confidential computing',t:'Hyper Protect Virtual Servers',facts:[['Generation','2nd generation Hyper Protect Platform'],['Built on','Secure Execution for Linux'],['Adds','Contracts, LUKS, EP11, signed stack']],notes:['An end-to-end platform for sensitive workloads: secure image build tooling, boot and data disk LUKS encryption, multiparty contracts and attestation, logging and registry authentication, CryptoExpress HSM access in EP11 mode, and a container runtime based on containerd and Docker Engine.'],x86:'Building the same end-to-end chain usually means assembling several vendors’ tools.',go:['cc','Explore Hyper Protect']},
attest:{k:'Confidential computing',t:'Attestation',facts:[['What it proves','Guest image integrity and authenticity'],['Bound to','Host hardware keys']],notes:['Attestation verifies the guest image before execution, so a compromised or tampered image can’t be deployed. In the rogue-agent scenario, a swapped image fails to attest instead of quietly coming up.'],x86:'TDX and SEV-SNP provide attestation; tooling and verification services vary by cloud.'},
vulns:{k:'Linux',t:'x86-specific vulnerabilities',facts:[['CPU and firmware examples','Foreshadow, MDS, Downfall, Zenbleed, Reptar, Sinkclose'],['Software examples','BadIRET, OpenSSL AVX-512 bugs, java4shell'],['On LinuxONE','Not affected']],notes:['Many major vulnerabilities live in x86 hardware or in software code paths written only for x86. The same Linux workloads on LinuxONE run on different hardware and different code paths, so those flaws don’t reach them.'],go:['vulns','See the list']},
dmcrypt:{k:'Linux',t:'Pervasive encryption: dm-crypt with protected keys',facts:[['Cipher','paes (protected-key AES) via CPACF'],['Key tool','zkey'],['Format','LUKS2'],['Clear key in OS memory','No']],notes:['Volumes are encrypted with keys wrapped by the HSM (secure keys) and turned into protected keys that only CPACF can use. Encrypting everything is practical because the cost is so low.'],x86:'dm-crypt uses clear keys held in kernel memory, recoverable from a memory dump.',go:['qs','See the key hierarchy']},
cryptolibs:{k:'Linux',t:'Crypto libraries',facts:[['Libraries','OpenSSL, libica, openCryptoki, GnuTLS'],['Use','TLS, SSH, PKCS#11'],['Code changes','None']],notes:['Standard libraries pick up CPACF and the HSM automatically, so TLS for data in flight is accelerated without application changes. openCryptoki gives applications PKCS#11 access to EP11 keys, including post-quantum algorithms.'],x86:'Same libraries, using AES-NI or QAT where available.'},
ocpiso:{k:'OpenShift',t:'Clusters in separate partitions',facts:[['Boundary between clusters','EAL5+ partition'],['Connection','HiperSockets or adapters']],notes:['Run separate clusters, such as development, regulated workloads, or AI agent sandboxes, in separate partitions. Cluster-to-cluster movement then has to cross a firmware-enforced boundary.'],x86:'Separate VMs or servers, connected through the network.'},
agents:{k:'OpenShift',t:'AI agent workloads',facts:[['Recommended placement','Own partition (and cluster)'],['Keys','Held in the HSM, not in the environment']],notes:['An agent that can run code is an untrusted tenant. Putting it in its own partition limits how far it can move if it breaks out of its sandbox, and keeping keys in the HSM means there are no clear secrets to steal.'],go:['iso','Walk through the scenario']},
hpcr:{k:'Containers',t:'Hyper Protect container runtime',facts:[['Based on','containerd and Docker Engine'],['Runs in','Hyper Protect Virtual Server']],notes:['OCI containers run inside the protected enclave, deployed through a signed, encrypted contract.'],go:['cc','See the Hyper Protect stack']},
mongodb:{k:'Applications and data platforms',t:'MongoDB',facts:[['Edition','MongoDB Enterprise Advanced'],['Data at rest','Volumes encrypted with protected keys'],['Data in flight','TLS accelerated by CPACF'],['Data in use','Can run inside Secure Execution guests']],notes:['MongoDB runs unchanged and inherits the platform’s protections. dm-crypt with protected keys sits under the data files, client and replica set TLS uses CPACF, and separate environments sit in separate EAL5+ partitions.'],x86:'Same software; disk encryption keys typically held in the clear in memory, and environments separated by VMs on shared hardware.'},
confluent:{k:'Applications and data platforms',t:'Confluent Platform',facts:[['Deployment','Confluent for Kubernetes on OpenShift'],['Data at rest','Topic data on encrypted volumes'],['Data in flight','Broker and client TLS accelerated by CPACF']],notes:['Kafka encrypts heavily in flight: between clients and brokers, and between brokers. CPACF takes that work off the cores, so TLS everywhere doesn’t cost throughput. Topic logs sit on volumes encrypted with protected keys.','Separate Kafka clusters, such as development and regulated workloads, can run in separate partitions.'],x86:'TLS uses AES-NI on general cores; encryption at rest needs clear keys in memory or an add-on.'},
edb:{k:'Applications and data platforms',t:'EDB Postgres',facts:[['Database','EDB Postgres Advanced Server and PostgreSQL'],['Data at rest','Tablespaces on encrypted volumes'],['Data in flight','TLS accelerated by CPACF']],notes:['EDB Postgres runs on Linux on LinuxONE with the same tools and procedures as elsewhere, while the platform encrypts its storage with protected keys and accelerates client connections.'],x86:'Same software; protections depend on add-on encryption and key management.'},
otherdb:{k:'Applications and data platforms',t:'Other databases',facts:[['Examples','IBM Db2, Oracle Database, PostgreSQL, MariaDB'],['Changes for encryption','None']],notes:['Any database on Linux gets the same base: volumes encrypted with protected keys, CPACF-accelerated TLS, HSM-held keys through PKCS#11 where the database supports it, and EAL5+ partition isolation between databases.'],x86:'Same databases; each protection is typically a separate product or option.'},
java:{k:'Runtimes',t:'Java runtimes',facts:[['Example','CVE-2026-114938 (java4shell, November 2026)'],['Vulnerable path','x86 AVX-512 VBMI Base64 intrinsic'],['On s390x','Path doesn’t exist']],notes:['The critical OpenJDK flaw disclosed in November 2026 is in an x86-specific accelerated code path. Platform-independent Java bugs still affect every architecture, so keep patching.'],go:['java','Open the CVE view']},
ep11app:{k:'Applications',t:'Application keys through PKCS#11',facts:[['Interface','PKCS#11 (openCryptoki EP11)'],['Key location','Inside the Crypto Express HSM']],notes:['Applications that sign, decrypt or authenticate can use keys that live in the HSM. A compromised process can ask for an operation but can’t copy the key out.'],x86:'Requires a separate HSM and client software.'}
};

/* CPU vulnerabilities */
const VULNS=[
 ['gather_data_sampling','Downfall (2023)','Intel AVX gather instructions can leak data from vector registers.','Not affected','n','Not affected','n'],
 ['indirect_target_selection','Indirect Target Selection (2025)','Intel indirect branch prediction flaw.','Mitigation: Aligned branch/return thunks','m','Not affected','n'],
 ['itlb_multihit','iTLB Multihit (2019)','Intel huge-page handling can let a guest trigger a machine check on the host.','Not affected','n','Not affected','n'],
 ['l1tf','L1 Terminal Fault / Foreshadow (2018)','Intel L1 data cache leak across processes, VMs and SGX.','Not affected','n','Not affected','n'],
 ['mds','Microarchitectural Data Sampling (2019)','ZombieLoad, RIDL, Fallout: Intel internal buffers leak data.','Not affected','n','Not affected','n'],
 ['meltdown','Meltdown (2018)','User code reads kernel memory. Mitigated with page table isolation, which costs performance.','Not affected','n','Not affected','n'],

 <div class="xresp"><h3>Addressing them as they come up</h3>

  <p>Running on more than one processor architecture means a flaw in one architecture’s hardware or code reaches only part of the estate. Architecture-specific bugs happen on every platform, LinuxONE included; the point is that one flaw rarely hits two architectures at once. Flaws in architecture-neutral code, such as Log4Shell, still need patching everywhere.</p>

 <h3 style="margin:22px 0 4px;font-size:15px">Walk through the July 2026 attack chain</h3>

 <div class="stepper"><button class="btn sec" data-iso="-1" aria-disabled="${S.isoStep===0}">← Previous</button><button class="btn" data-iso="1" aria-disabled="${S.isoStep===ISO_STEPS.length-1}">Next step →</button><span style="font-size:14px;color:#525252;margin-left:8px">Step ${S.isoStep+1} of ${ISO_STEPS.length}</span><button class="link" data-iso="0" style="margin-left:auto">Start over</button></div>
 <div class="wrap"><div class="stage">
 <div class="iso">
  <div class="isobox"><h3>IBM LinuxONE</h3>
   <div class="cec">
    <div class="parts">${['Agent sandbox','OpenShift: apps','Database','Kafka'].map((n,i)=>`<div class="part ${i===0?'hot':''}"><div class="os">${i===0?'⚠ ':''}${n}</div><div class="vm">KVM or z/VM</div><div class="pp">Partition</div>${i===0&&S.isoStep>=2?'<div class="pp" style="border-color:#198038;color:#198038">Keys in HSM</div>':''}</div>`).join('')}</div>
    <div class="fwbar">PR/SM firmware · EAL5+ boundaries ${lateral?'<b style="color:#198038">· movement blocked</b>':''}</div>
    <div class="hwbar">Hardware · Crypto Express8S · CPACF</div>
   </div>
   <p style="font-size:12px;color:#525252;margin:8px 0 0">Red bars: partition boundaries enforced by firmware. Partitions communicate in memory over HiperSockets or SMC-D, without a physical network.</p>
  </div>
  <div class="isobox"><h3>x86 servers on a network</h3>
   <div class="racks">${['Agent sandbox','OpenShift: apps','Database'].map((n,i)=>`<div class="srv ${i===0?'hot':''} ${lateral&&i>0?'hit':''}"><div class="os">${(i===0||lateral)?'⚠ ':''}${n}</div><div class="vm">Hypervisor</div><div class="vm">Server</div></div>`).join('')}</div>
   <div class="net ${lateral?'hit':''}">Physical network and switches ${lateral?'· lateral movement':''}</div>
   <p style="font-size:12px;color:#525252;margin:8px 0 0">Air-gapped or segmented servers still share a physical network, which is itself an attack surface.</p>
  </div>
 </div>
 <h3 style="margin:18px 0 8px;font-size:15px">Attack chain</h3><div class="flow">`;
 ISO_STEPS.forEach((s,i)=>{
  const shown=i<=S.isoStep;
  const cls=!shown?'blocked':(s.lv==='ok'?'ok':'bad');
  h+=`<div class="fstep ${cls}"><div class="rail"><span class="b">${i+1}</span>${i<ISO_STEPS.length-1?'<span class="ln"></span>':''}</div><button class="fbox" data-isostep="${i}" aria-pressed="${i===S.isoStep}"><div class="h">${esc(s.t)}${shown?(s.lv==='ok'?'<span class="pill g">LinuxONE control applies</span>':'<span class="pill r">Not stopped</span>'):''}</div>${shown?`<div class="d">${esc(s.l1)}</div>`:''}</button></div>`;
 });
 h+='</div></div>';
 const p={k:`Step ${S.isoStep+1} of ${ISO_STEPS.length}`,t:st.t,notes:[st.d,'LinuxONE: '+st.l1],x86:st.x};
 const extra=`<div class="caveat"><b>What this doesn’t do:</b> none of this fixes the root cause, which was application-layer zero-days and permissive agent settings. LinuxONE limits the blast radius: isolation, sealed keys and attestation. Confidential computing protects a workload from the host; it doesn’t control what a workload does.</div>`;
 h+=panel(p,extra)+'</div>';
 return h;
}

function vCC(){
 const host=S.ccView==='host',hp=S.hp;
 const mem=(secure)=>{
  if(!host)return `<div class="ccmem ok"><span class="mono">order=4411 · card=****9921</span><em>Readable inside the VM</em></div>`;
  return secure?`<div class="ccmem lock"><span>🔒 Access blocked</span><em>The Ultravisor stops the host from reading or changing this memory</em></div>`
   :`<div class="ccmem warn"><span class="mono">order=4411 · card=****9921</span><em>Readable by the host</em></div>`;
 };
 const vm=(id,secure)=>`<button class="ccvm ${secure?'sec':''}" data-cc="${id}" aria-pressed="${S.ccSel===id}">
   <span class="vt">${secure?(hp?'Hyper Protect Virtual Server':'Secure Execution VM'):'Regular VM'}</span>
   ${secure&&hp?`<span class="layer">Your containers</span><span class="layer">Hyper Protect runtime · signed contract</span><span class="layer">LUKS-encrypted disks</span>`:`<span class="layer">Applications</span><span class="layer">Linux</span>`}
   ${mem(secure)}</button>`;
 let h=`<h2>Confidential computing with IBM Secure Execution for Linux</h2>
 <p class="h2sub">Secure Execution runs a virtual machine so that nothing outside it, including the hypervisor and the administrators of the host, can read or change its memory. The protection is enforced by trusted firmware in the machine, called the Ultravisor, not by software the host controls.</p>
 <div class="ccpro">
  <div class="yes"><h3>Protects against</h3><ul>
   <li>A compromised or malicious hypervisor</li>
   <li>Host and cloud administrators reading or changing VM memory, CPU state or the VM image</li>
   <li>Memory dumps taken on the host</li>
   <li>Other VMs on the same host</li>
   <li>The VM image being started on a machine it wasn’t built for</li>
   <li>A tampered image, detected by attestation</li></ul></div>
  <div class="no"><h3>Doesn’t protect against</h3><ul>
   <li>Flaws inside the VM: an attacker who gets into its applications or Linux sees what the VM sees</li>
   <li>Data on disks or the network: encrypt those inside the VM (LUKS, TLS)</li>
   <li>Being shut down: the host can still stop, pause or refuse to start the VM. Secure Execution keeps the VM’s data private; it doesn’t guarantee the VM stays running</li></ul></div>
 </div>
 <div class="row" style="margin-top:16px"><span class="lbl">Look at memory from</span>${chips([['guest','Inside the VM'],['host','The KVM host']],host?'host':'guest','ccview')}
 <span class="lbl" style="margin-left:16px">Show</span>${chips([['0','Secure Execution'],['1','Hyper Protect Virtual Servers']],hp?'1':'0','hp')}</div>
 <div class="wrap" style="margin-top:14px"><div class="stage">
  <div class="viewbadge" style="margin-bottom:10px">${host?'<b>From the KVM host:</b> the regular VM’s memory is readable, as on any hypervisor. The Secure Execution VM’s memory is off limits, even to root on the host.':'<b>From inside each VM:</b> the VM’s own Linux and applications read their memory normally. Secure Execution is invisible to them, so applications don’t change.'}</div>
  <div class="ccbox"><span class="cclbl">IBM LinuxONE</span>
   <div class="cclpar"><span class="cclbl">One partition</span>
    <button class="cchost" data-cc="host" aria-pressed="${S.ccSel==='host'}">KVM host: Linux with the KVM hypervisor <span>Starts, stops and schedules both VMs</span></button>
    <div class="ccvms">${vm('g0',false)}${vm('g1',true)}</div>
   </div>
   <div class="ccfw"><button class="ccb" data-cc="prsm" aria-pressed="${S.ccSel==='prsm'}">Firmware: PR/SM</button><button class="ccb u" data-cc="ut" aria-pressed="${S.ccSel==='ut'}">Firmware: Ultravisor <span>guards Secure Execution VMs</span></button></div>
   <div class="cchw">Hardware: host key pair, unique to this machine</div>
  </div>
  <h3 style="margin:20px 0 8px;font-size:15px">How it works</h3>
  <ol class="ccsteps">
   <li><b>Build:</b> the VM owner encrypts the boot image with the public host key of each LinuxONE machine allowed to run it.</li>
   <li><b>Start:</b> the host administrator starts it like any VM. The hypervisor can’t decrypt the image.</li>
   <li><b>Protect:</b> the Ultravisor decrypts the image into memory that only the VM can use. From here on, the host can’t read or change the VM’s memory or CPU state.</li>
   <li><b>Verify:</b> the VM owner uses attestation to confirm the VM is running under Secure Execution, on the right machine, with the expected image.</li>
   <li><b>Page out safely:</b> if the host needs to swap VM memory out, the Ultravisor encrypts each page before the host gets it.</li>
  </ol>
  ${hp?`<h3 style="margin:20px 0 8px;font-size:15px">What Hyper Protect Virtual Servers add</h3><ul class="cchp">${HP_HIGHLIGHTS.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 </div>`;
 const P={
  g0:{k:'Virtual machine',t:'Regular VM',facts:[['Host can read its memory','Yes'],['Protection','The hypervisor’s isolation only']],notes:['The usual virtualization trust model: you trust the hypervisor and everyone who administers it.'],dg:DG.cc_g0},
  g1:hp?{k:'Hyper Protect Platform',t:'Hyper Protect Virtual Server',facts:[['Built on','Secure Execution'],['Workloads','OCI containers'],['Deployed with','A signed, encrypted contract'],['HSM access','Crypto Express in EP11 mode']],notes:['A ready-made platform on top of Secure Execution: a locked-down, signed stack that runs your containers, with encrypted disks and multiparty contracts, so workload owners don’t have to build these pieces themselves.'],dg:DG.hpvs}
   :{k:'Virtual machine',t:'Secure Execution VM',facts:[['Host can read its memory','No'],['Host can change its memory or CPU state','No'],['Image','Encrypted for specific machines'],['Application changes','None']],notes:['Its Linux and applications run normally. The Ultravisor blocks every access from outside the VM, and attestation lets the owner prove what is running.','Encrypt its disks and network traffic from inside the VM, since Secure Execution protects memory and CPU state, not storage or the network.'],dg:DG.cc_host},
  host:{k:'Partition',t:'KVM host and hypervisor',facts:[['Manages both VMs','Yes'],['Reads regular VM memory','Yes'],['Reads Secure Execution VM memory','No']],notes:['The hypervisor still does its job: it starts, stops and schedules every VM. For a Secure Execution VM it does that without being able to see inside.'],dg:DG.cc_host},
  ut:{k:'Firmware',t:'Ultravisor',facts:[['Type','Trusted firmware'],['Enforces','Memory and CPU state protection'],['Holds','The machine’s private host key']],notes:['The Ultravisor tracks which memory belongs to each Secure Execution VM and blocks the hypervisor, and other VMs, from touching it. Because it runs in firmware, a compromised host can’t switch it off.'],dg:DG.cc_ut},
  prsm:{k:'Firmware',t:'PR/SM',facts:[['Role','Creates partitions'],['Isolation','Common Criteria EAL5+']],notes:['PR/SM divides the machine into partitions. Secure Execution adds protection inside a partition, between the KVM host and its VMs.'],dg:DG.prsm}
 };
 const sel=P[S.ccSel]||P.g1;
 h+=panel(sel,'',sel.dg)+'</div>';
 return h;
}

 <p class="h2sub">IBM z17 and LinuxONE 5 are positioned by IBM as the first quantum-safe servers. Pervasive encryption means encrypting all data at rest and in flight, which is practical because CPACF and protected keys make it cheap.</p>

 <h3 style="margin:20px 0 0;font-size:15px">Quantum-safe, end to end</h3>
 <div class="qgrid">${QS_CARDS.map(q=>`<button class="qcard" data-q="${q.id}" aria-pressed="${S.qsel===q.id}"><span class="qk">${esc(q.k)}</span><span class="qt">${esc(q.t)}</span><span class="qd">${esc(q.d)}</span></button>`).join('')}</div>

 <p style="font-size:12px;color:#525252;margin:8px 0 0">x86 add-on examples include AMD Secure Memory Encryption, Intel QuickAssist Technology and HyTrust.</p>
 </div>`;
 const pk=S._lastQ?Q:K;
 h+=panel(S._lastQ?{k:Q.k,t:Q.t,facts:Q.facts,notes:Q.notes,go:Q.go}:{k:'Key type',t:K.t,facts:K.facts,notes:K.notes},'',S._lastQ?DG['q_'+Q.id]:DG['k_'+K.id])+'</div>';
 return h;
}


/* ============================== ARCHITECTURE AS A SECURITY CONTROL ============================== */
const MTYPES={
 now:{lbl:'Move exposed services now',c:'r',short:'Emergency move',steps:['Confirm the flaw is tied to x86 (vendor bulletin, CPU flags)','Apply the vendor workaround on x86 right away','Move only the exposed services to the LinuxONE cluster with a GitOps placement change','Verify the services answer from LinuxONE and no affected x86 instance still serves them','When fixed packages are installed on x86, move back or stay']},
 policy:{lbl:'Keep sensitive workloads off x86 hosts',c:'y',short:'Standing placement',steps:['Identify workloads that hold secrets or regulated data and share x86 hosts with code you don’t fully trust','Place those workloads on LinuxONE by default, as policy rather than in an emergency','Apply microcode and kernel fixes on x86 for everything that stays there','Account for the x86 mitigation overhead, such as page table isolation or disabling SMT, in capacity plans']},
 patch:{lbl:'Patch everywhere',c:'n',short:'No placement change',steps:['Confirm the flaw affects every architecture','Patch both clusters on the normal emergency timeline','Leave placement unchanged: moving gains nothing']}
};

 {id:'downfall',t:'Downfall',sub:'Gather data sampling',yr:'2023',type:'policy',x:['r','Intel affected'],z:['g','Not affected'],vec:'Local: attacker code on the same host',fix:'Microcode at disclosure',cost:'Slower vector workloads on some CPUs',exp:['pay','auth','kafka'],why:'Workloads holding secrets on hosts shared with untrusted code',d:'Intel AVX gather instructions can leak data from vector registers across processes and VMs.',note:'An attacker needs code running on the same physical host, such as a co-tenant VM or a CI job. The risk is to whatever secrets share that host.'},
 {id:'inception',t:'Inception',sub:'Speculative return stack overflow',yr:'2023',type:'policy',x:['r','AMD Zen affected'],z:['g','Not affected'],vec:'Local: attacker code on the same host',fix:'Microcode and kernel updates',cost:'Kernel mitigation overhead',exp:['pay','auth','kafka'],why:'Workloads holding secrets on hosts shared with untrusted code',d:'AMD Zen processors can be tricked into mispredicting returns, leaking kernel memory.',note:'Like other side channels, it needs local code execution. Keeping sensitive workloads on LinuxONE removes them from this class of flaw entirely.'},

 {id:'spectre',t:'Spectre v1 and v2',sub:'Bounds check bypass, branch target injection',yr:'2018',type:'patch',x:['y','Affected, mitigated'],z:['y','Affected, mitigated'],vec:'Local: attacker code on the same host',fix:'Kernel and firmware updates on both',cost:'Mitigations on both architectures',exp:[],why:'',d:'A property of speculative execution on processors of every major architecture.',note:'Both architectures need and have mitigations. LinuxONE’s Spectre v2 mitigation uses a hardware facility (etokens).'},
 {id:'log4shell',t:'Log4Shell',sub:'CVE-2021-44228',yr:'2021',type:'patch',x:['r','Affected'],z:['r','Affected'],vec:'Remote, unauthenticated',fix:'Library update within days',cost:'—',exp:['pay','auth','kafka'],why:'Java services using Log4j, on either cluster',d:'Remote code execution in the Log4j logging library through crafted log messages.',note:'An application library flaw: it behaves the same on every architecture.'},

function vMulti(){
 const C=MCVE.find(c=>c.id==='j4s');const moved=S.mmoved;
 const exp=new Set(C.exp);const onZ=w=>moved&&exp.has(w.id);
 const badge=st=>`<span class="st ${st[0]==='r'?'v':'n'}">${esc(st[1])}</span>`;
 const wl=(w,where)=>{const bad=exp.has(w.id)&&where==='x';
  return `<div class="mwl ${bad?'exp':''} ${where==='z'&&moved?'arrive':''}"><b>${esc(w.t)}</b><span>${esc(w.tag)}</span>${bad?'<em>Exposed</em>':''}</div>`};
 const cluster=(k,title,sub,st)=>{const list=MWL.filter(w=>k==='z'?onZ(w):!onZ(w));
  return `<div class="mpool ${k==='x'&&list.some(w=>exp.has(w.id))?'bad':''}"><div class="mph"><div><b>${title}</b><span>${sub}</span></div>${badge(st)}</div><div class="mwls">${list.length?list.map(w=>wl(w,k)).join(''):'<span class="mempty">No workloads here yet</span>'}</div></div>`};
 let h=`<h2>Architecture as a security control</h2>
 <p class="h2sub">Some flaws exist only on x86. With the same Linux applications able to run on LinuxONE, an x86-only flaw becomes a placement decision instead of an emergency: the exposed services move to LinuxONE, which isn’t affected, while x86 is patched.</p>
 <div class="wrap" style="margin-top:14px"><div class="stage">
  <div class="stepper" style="margin:0 0 12px">
   <button class="btn" data-mmove="1" aria-disabled="${moved}">Move the exposed services to LinuxONE →</button><button class="btn sec" data-mmove="0" aria-disabled="${!moved}">Reset</button>
   <span style="font-size:14px;color:#525252">${moved?'The exposed services now run on LinuxONE; x86 is patched without exposure.':'Example: java4shell, an x86-only Java flaw disclosed in November 2026 with no fix available at disclosure.'}</span>
  </div>
  <div class="mcluster">
   <div class="mpools">${cluster('x','x86 Linux','Intel or AMD servers',C.x)}${cluster('z','LinuxONE Linux','s390x partitions',C.z)}</div>
   <div class="mgit">Same Linux distributions and applications on both · deployed as packages, VMs or containers with existing automation, such as Ansible or OpenShift</div>
  </div>
  <h3 style="margin:18px 0 8px;font-size:15px">How it works</h3>
  <ol class="mplay">
   <li>Make each critical service deployable on both x86 and LinuxONE: s390x packages, builds or container images.</li>
   <li>When a flaw is disclosed that exists only on x86, apply the vendor workaround on x86.</li>
   <li>Move the exposed services to LinuxONE with the automation you already use, such as Ansible playbooks or OpenShift GitOps.</li>
   <li>Patch x86 at its own pace, then move the services back or leave them on LinuxONE.</li>
  </ol>
  <p style="margin:14px 0 0;font-size:13px;line-height:19px;color:#525252">This applies to flaws that exist only on x86, such as java4shell, Meltdown and MDS. Flaws that affect every architecture, such as Log4Shell, are patched everywhere.</p>
 </div>`;
 const p={k:`${C.sub} · ${C.yr}`,t:'Example: '+C.t,facts:[['x86',C.x[1]],['LinuxONE',C.z[1]],['Exposed','Java services that decode untrusted Base64']],notes:[C.d,'Only the exposed services need to move: here the internet-facing payments API and authentication service. Red Hat’s bulletin doesn’t list s390x among the affected architectures.']};
 const dg={type:'flow',alt:'Moving exposed services off an affected architecture',cap:'An x86-only flaw becomes a placement change',rows:[{nodes:[['x86-only flaw disclosed','r'],['Exposed services move','b',moved],['Run on LinuxONE, unaffected','g',moved]]}]};
 h+=panel(p,'',dg)+'</div>';
 return h;
}

});
